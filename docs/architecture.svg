<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Enamel Vault architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5248"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #5b5248; stroke-width: 1.5; rx: 10; }
      .group { fill: #f6f1ea; stroke: #c9bcab; stroke-width: 1.2; rx: 14; }
      .family { fill: #fdf3e7; stroke: #b5651d; stroke-width: 1.5; rx: 10; }
      .kitchen { fill: #eaf2ee; stroke: #2f6b4f; stroke-width: 1.5; rx: 10; }
      .t { fill: #2a2420; font-size: 15px; font-weight: 600; }
      .s { fill: #5b5248; font-size: 12.5px; }
      .h { fill: #5b5248; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
      .line { stroke: #5b5248; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #2f6b4f; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>

  <!-- Clients -->
  <text class="h" x="40" y="36">CLIENTS</text>
  <rect class="family" x="40" y="50" width="200" height="70"/>
  <text class="t" x="56" y="78">Family recipes app</text>
  <text class="s" x="56" y="100">recipes.enamelvault.com</text>

  <rect class="kitchen" x="260" y="50" width="200" height="70"/>
  <text class="t" x="276" y="78">Kitchen app</text>
  <text class="s" x="276" y="100">kitchen.enamelvault.com</text>

  <rect class="box" x="480" y="50" width="200" height="70"/>
  <text class="t" x="496" y="78">Moderation console</text>
  <text class="s" x="496" y="100">admin.enamelvault.com</text>

  <rect class="box" x="720" y="50" width="200" height="70"/>
  <text class="t" x="736" y="78">Phone app (Expo)</text>
  <text class="s" x="736" y="100">offline copy in SQLite</text>

  <!-- Worker -->
  <rect class="group" x="40" y="160" width="640" height="78"/>
  <text class="t" x="56" y="188">Cloudflare Worker</text>
  <text class="s" x="56" y="210">Serves the three web apps and enamelvault.com. Adds page titles, link previews,</text>
  <text class="s" x="56" y="226">the sitemap and a strict Content-Security-Policy.</text>

  <path class="line" d="M140,120 V158"/>
  <path class="line" d="M360,120 V158"/>
  <path class="line" d="M580,120 V158"/>

  <!-- Session -->
  <text class="s" x="56" y="262">One sign-in covers all three web apps: the session is a cookie on .enamelvault.com</text>

  <!-- Supabase -->
  <rect class="group" x="40" y="286" width="880" height="300"/>
  <text class="h" x="56" y="312">SUPABASE</text>

  <rect class="box" x="56" y="326" width="180" height="70"/>
  <text class="t" x="72" y="354">Auth</text>
  <text class="s" x="72" y="376">email, Google, Apple</text>

  <rect class="box" x="56" y="410" width="180" height="70"/>
  <text class="t" x="72" y="438">Storage</text>
  <text class="s" x="72" y="460">recipe photos</text>

  <rect class="box" x="56" y="494" width="180" height="76"/>
  <text class="t" x="72" y="520">Edge functions</text>
  <text class="s" x="72" y="540">AI recipe import, account</text>
  <text class="s" x="72" y="556">deletion, report alerts, admin</text>

  <!-- Postgres -->
  <rect class="box" x="262" y="326" width="642" height="244"/>
  <text class="t" x="278" y="354">Postgres</text>
  <text class="s" x="278" y="374">Row-level security on every table is the whole security model.</text>

  <rect class="family" x="278" y="392" width="290" height="116"/>
  <text class="t" x="294" y="420">Family data</text>
  <text class="s" x="294" y="442">recipes, families, meal plans,</text>
  <text class="s" x="294" y="460">grocery lists, comments, Potluck</text>
  <text class="s" x="294" y="478">feed, moderation</text>

  <rect class="kitchen" x="598" y="392" width="290" height="116"/>
  <text class="t" x="614" y="420">Kitchen data (own schema)</text>
  <text class="s" x="614" y="442">groups, sites, staff roles,</text>
  <text class="s" x="614" y="460">dishes, versions, trials,</text>
  <text class="s" x="614" y="478">approvals</text>

  <text class="s" x="278" y="532">The two never share data. The console reads the family side, and reaches</text>
  <text class="s" x="278" y="550">the kitchen side only as counts, through the admin function.</text>

  <!-- Clients to Supabase -->
  <path class="line" d="M620,238 V324"/>
  <text class="s" x="630" y="278">the web apps call</text>
  <text class="s" x="630" y="294">Supabase from the browser</text>
  <path class="line" d="M820,120 V324"/>
  <text class="s" x="830" y="230">direct, with its</text>
  <text class="s" x="830" y="246">own session</text>

  <!-- admin crossing -->
  <path class="dash" d="M236,532 C250,600 700,610 743,510"/>
  <text class="s" x="500" y="604" fill="#2f6b4f">counts only</text>
</svg>
